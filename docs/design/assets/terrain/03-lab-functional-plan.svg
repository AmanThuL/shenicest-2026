<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">实验室放射状功能平面</title>
  <desc id="desc">依据策划画板场景设想二和三整理的中央植物玻璃房、蓄水区、暗室、实验区、档案区、居住后勤区和检修入口关系图。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#25322c" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0L18 9L0 18Z" fill="#d7653f"/></marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #24322c; }
      .label { font-size: 25px; font-weight: 650; }
      .small { font-size: 20px; }
      .tiny { font-size: 17px; }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#f5f1e8"/>
  <text x="70" y="68" font-size="34" font-weight="720">实验室功能平面 · 画板关系落地</text>
  <text x="70" y="104" class="small" fill="#5c685f">依据画板建立放射状空间关系；画板无北箭头，本文暂定图面上方为北，最终尺寸待建筑定稿。</text>

  <g transform="translate(85 135)" filter="url(#shadow)">
    <rect width="1110" height="830" rx="30" fill="#e5ded0" stroke="#b3a891" stroke-width="3"/>
    <!-- Site and exterior ring. -->
    <ellipse cx="555" cy="408" rx="465" ry="355" fill="#76866c" stroke="#455a48" stroke-width="5"/>
    <ellipse cx="555" cy="408" rx="392" ry="300" fill="#b2ab99" stroke="#59665e" stroke-width="5"/>
    <ellipse cx="555" cy="408" rx="316" ry="242" fill="#d6d0c2" stroke="#394a43" stroke-width="7"/>

    <!-- Radial corridors. -->
    <g fill="#87988e" stroke="#394a43" stroke-width="5">
      <path d="M512 249 L472 120 L640 120 L598 249Z"/>
      <path d="M705 326 L833 238 L915 351 L745 414Z"/>
      <path d="M704 494 L840 594 L744 694 L614 559Z"/>
      <path d="M493 560 L367 704 L271 597 L411 487Z"/>
      <path d="M405 330 L260 231 L187 360 L375 416Z"/>
    </g>

    <!-- Rooms. -->
    <g stroke="#394a43" stroke-width="5">
      <path d="M472 120 H640 L671 61 H445Z" fill="#6f91a1"/>
      <path d="M833 238 L942 166 L1024 327 L915 351Z" fill="#536b58"/>
      <path d="M915 351 L1036 377 L1011 540 L846 502 L745 414Z" fill="#b6a77d"/>
      <path d="M840 594 L795 760 L628 739 L614 559 L744 694Z" fill="#9b806b"/>
      <path d="M367 704 L241 753 L143 613 L271 597Z" fill="#9d9184"/>
      <path d="M260 231 L132 283 L119 459 L187 527 L375 416Z" fill="#a69b7a"/>
    </g>

    <!-- Central octagonal glass room. -->
    <path d="M469 291 L552 254 L638 284 L691 350 L687 451 L627 526 L532 554 L445 509 L405 427 L420 344Z"
          fill="#a8cdc1" fill-opacity="0.88" stroke="#2f4c45" stroke-width="7"/>
    <g stroke="#6c9f93" stroke-width="3" opacity="0.9">
      <line x1="552" y1="254" x2="532" y2="554"/><line x1="405" y1="427" x2="687" y2="451"/><line x1="469" y1="291" x2="627" y2="526"/><line x1="638" y1="284" x2="445" y2="509"/>
    </g>
    <g stroke="#3e7048" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M521 472v-96m0 41l-36-27m36 10l39-35M590 475v-108m0 43l-33-28m33 10l35-29"/>
    </g>

    <!-- Dark room spiral and observation ring. -->
    <g transform="translate(940 260)">
      <circle r="72" fill="#31473b" stroke="#26352e" stroke-width="6"/>
      <path d="M0-48 C41-48 53-4 29 21 C8 44-31 31-31 1 C-31-22-5-29 8-13 C17-1 7 14-5 10" fill="none" stroke="#b6c59f" stroke-width="5"/>
      <circle r="54" fill="none" stroke="#d2c8a8" stroke-width="5" stroke-dasharray="12 8"/>
    </g>

    <!-- Entrances and route. -->
    <path d="M497 753 L612 753" stroke="#933f35" stroke-width="15" stroke-linecap="round"/>
    <path d="M823 643 L859 677" stroke="#d7653f" stroke-width="15" stroke-linecap="round"/>
    <path d="M1005 742 C932 740 885 696 842 647 C794 591 736 548 674 519 C611 489 521 518 450 492 C383 468 350 411 381 357 C412 303 464 290 505 272"
          fill="none" stroke="#fff3dd" stroke-width="20" stroke-linecap="round"/>
    <path d="M1005 742 C932 740 885 696 842 647 C794 591 736 548 674 519 C611 489 521 518 450 492 C383 468 350 411 381 357 C412 303 464 290 505 272"
          fill="none" stroke="#d7653f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- Labels. -->
    <text x="477" y="88" class="label">北翼 · 蓄水池／储水区</text>
    <text x="851" y="126" class="label">东北 · 蘑菇暗室</text>
    <text x="848" y="151" class="small">旋转楼梯＋上层环形观察平台</text>
    <text x="879" y="445" class="label">东翼 · 实验区</text>
    <text x="672" y="725" class="label">南翼 · 档案区</text>
    <text x="115" y="785" class="label">西翼 · 居住／后勤</text>
    <text x="118" y="203" class="small">支持空间沿外环分布</text>
    <text x="465" y="409" class="label">中央植物玻璃房</text>
    <text x="470" y="436" class="small">阳光房／主实验室展开区</text>
    <text x="432" y="790" class="small" fill="#933f35">损坏且受阻正门</text>
    <text x="815" y="711" class="small" fill="#b64e35">00-16 外门 → S0 内闸</text>
    <text x="855" y="737" class="small" fill="#b64e35">室外→室内加载路线</text>

    <!-- Approximate dimensions. -->
    <g stroke="#26362f" stroke-width="2" fill="none">
      <path d="M119 804v18M1036 804v18M119 813h917"/>
      <path d="M1063 61h18M1063 760h18M1072 61v699"/>
    </g>
    <text x="436" y="850" class="small">建筑占位宽度待定稿后锁定</text>
    <text x="1086" y="365" class="small" transform="rotate(90 1086 365)">建筑占位纵深待定稿后锁定</text>
  </g>

  <g transform="translate(1240 150)">
    <rect width="300" height="700" rx="24" fill="#fffaf0" stroke="#c9bda8" stroke-width="2"/>
    <text x="28" y="48" class="label">空间落地原则</text>
    <text x="28" y="91" class="small" font-weight="650">画板优先</text>
    <text x="28" y="122" class="tiny">• 中央玻璃植物房</text>
    <text x="28" y="150" class="tiny">• 北蓄水、西生活、东实验</text>
    <text x="28" y="178" class="tiny">• 南档案、东北蘑菇暗室</text>
    <text x="28" y="206" class="tiny">• 暗室保留螺旋楼梯与观察环</text>

    <line x1="28" y1="237" x2="270" y2="237" stroke="#d8cdbb"/>
    <text x="28" y="275" class="small" font-weight="650">地形与建筑接口</text>
    <text x="28" y="307" class="tiny">• 使用可调放射状占位体</text>
    <text x="28" y="335" class="tiny">• 建筑台地始终保持水平</text>
    <text x="28" y="363" class="tiny">• 外轮廓定稿后再校准台地</text>
    <text x="28" y="391" class="tiny">• 玻璃屋顶保留采光净空</text>

    <line x1="28" y1="422" x2="270" y2="422" stroke="#d8cdbb"/>
    <text x="28" y="460" class="small" font-weight="650">Gameplay 节拍</text>
    <text x="28" y="492" class="tiny">• S0 是门斗内侧金属闸门</text>
    <text x="28" y="520" class="tiny">• S1–S6 沿外环／侧翼推进</text>
    <text x="28" y="548" class="tiny">• S7–S9 在中央与南翼展开</text>
    <text x="28" y="576" class="tiny">• S10–S12 向次级出口收束</text>
    <text x="28" y="614" class="tiny">暗室的正式开放时机仍由章节</text>
    <text x="28" y="638" class="tiny">流程决定；先保留空间和锁门接口。</text>
  </g>

  <g transform="translate(1280 895)">
    <path d="M55 90V10M55 10L43 33M55 10L67 33" stroke="#26362f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="44" y="103" class="small">北</text>
  </g>
</svg>
