<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">室外环带地形总平面</title>
  <desc id="desc">依据策划画板整理的室外同心生态环、起伏路线、坡上实验室台地、损坏且受阻的正门和检修入口关系图。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#21332a" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M0 0 L18 9 L0 18 Z" fill="#d7653f"/>
    </marker>
    <pattern id="deadTrees" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M23 8v25M14 21l9-8 9 8" fill="none" stroke="#6f7569" stroke-width="3" stroke-linecap="round" opacity="0.46"/>
    </pattern>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #24322c; }
      .label { font-size: 26px; font-weight: 650; }
      .small { font-size: 20px; }
      .tiny { font-size: 17px; }
      .note { fill: #5b675f; font-size: 19px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f5f1e8"/>
  <text x="70" y="70" font-size="34" font-weight="720">室外环带地形总平面 · Greybox Rev 0.2</text>
  <text x="70" y="105" class="note">画板关系优先；尺寸为第一轮走测值，不是对草图比例的机械描摹。</text>

  <g transform="translate(130 135)" filter="url(#shadow)">
    <rect width="1080" height="790" rx="28" fill="#ebe3d4" stroke="#b7aa93" stroke-width="3"/>

    <!-- Concentric ecological bands, intentionally irregular. -->
    <path d="M102 641 C33 518 53 304 177 164 C315 8 595 19 805 92 C1015 165 1089 345 1016 533 C947 710 737 780 498 765 C315 753 174 746 102 641Z"
          fill="#b9b49f" stroke="#666d62" stroke-width="4"/>
    <path d="M133 618 C70 508 91 332 203 207 C331 65 567 61 759 124 C943 185 1025 332 970 488 C910 659 711 724 504 712 C325 701 198 715 133 618Z"
          fill="#87947b" stroke="#596759" stroke-width="4"/>
    <path d="M194 588 C147 494 170 362 265 267 C369 164 555 151 704 195 C852 239 930 350 894 464 C846 614 679 664 510 652 C356 641 244 677 194 588Z"
          fill="#9aa96e" stroke="#64734d" stroke-width="4" stroke-dasharray="18 9"/>
    <path d="M269 551 C236 477 264 384 337 318 C421 243 553 239 666 270 C778 301 837 386 811 476 C779 585 650 615 524 605 C408 596 305 629 269 551Z"
          fill="#6f8a62" stroke="#4f6d4c" stroke-width="4"/>
    <path d="M364 514 C342 455 371 394 428 355 C492 311 582 311 654 337 C724 362 757 413 738 476 C717 544 632 567 548 557 C472 548 389 579 364 514Z"
          fill="#6f8068" stroke="#425b49" stroke-width="4"/>
    <path d="M102 641 C33 518 53 304 177 164 C315 8 595 19 805 92 C1015 165 1089 345 1016 533 C947 710 737 780 498 765 C315 753 174 746 102 641Z"
          fill="url(#deadTrees)" opacity="0.78"/>

    <!-- Facility cut/fill terrace. -->
    <path d="M378 360 C421 287 532 263 635 292 C738 322 785 398 751 483 C715 572 607 599 503 568 C412 541 334 445 378 360Z"
          fill="#a89f89" stroke="#5c655e" stroke-width="5" stroke-dasharray="10 8"/>

    <!-- Radial facility shell. -->
    <g transform="translate(556 430)" stroke="#394842" stroke-width="4">
      <path d="M-59-44 L-20-75 L31-69 L67-28 L60 30 L20 66 L-35 61 L-69 18Z" fill="#c7d4c2"/>
      <ellipse cx="0" cy="-4" rx="50" ry="42" fill="#a8c8c0" opacity="0.82"/>
      <path d="M-38-65 L-111-126 L-152-91 L-68-15Z" fill="#c2cbc0"/>
      <path d="M49-48 L127-103 L161-59 L65 9Z" fill="#c2cbc0"/>
      <path d="M59 27 L145 89 L111 132 L26 61Z" fill="#c2cbc0"/>
      <path d="M-35 56 L-91 137 L-138 108 L-63 24Z" fill="#c2cbc0"/>
      <path d="M-126-99 L-79-42 M137-81 L74-22 M128 108 L63 50 M-115 122 L-57 48" fill="none" stroke="#77968b" stroke-width="8"/>
    </g>

    <!-- Player route, follows rings rather than a straight corridor. -->
    <path d="M516 748 C407 729 275 691 225 611 C177 533 214 463 296 445 C368 429 414 495 472 528 C505 547 533 559 555 568 C574 610 634 617 682 584 C698 573 707 558 713 545"
          fill="none" stroke="#fff4df" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.84"/>
    <path d="M516 748 C407 729 275 691 225 611 C177 533 214 463 296 445 C368 429 414 495 472 528 C505 547 533 559 555 568 C574 610 634 617 682 584 C698 573 707 558 713 545"
          fill="none" stroke="#d7653f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

    <!-- Main entrance and service entrance. -->
    <path d="M533 565 L579 568" stroke="#933f35" stroke-width="12" stroke-linecap="round"/>
    <path d="M694 520 L713 545" stroke="#d7653f" stroke-width="12" stroke-linecap="round"/>

    <!-- Labels. -->
    <g>
      <circle cx="516" cy="748" r="13" fill="#d7653f"/>
      <text x="545" y="756" class="label">玩家苏醒</text>
      <text x="545" y="781" class="small">外环南侧低地，先见死亡生态</text>

      <text x="94" y="202" class="label">A 死亡／倒伏植物外环</text>
      <text x="93" y="228" class="small">不规则密度，后方与侧边形成软边界</text>

      <text x="110" y="330" class="label">B 半死亡过渡环</text>
      <text x="110" y="356" class="small">地表湿度、冠层与环境声逐层恢复</text>

      <text x="160" y="474" class="label">C 异色草带</text>
      <text x="160" y="500" class="small">画板的仙女环构图母题；地面视角不可看全</text>

      <text x="772" y="628" class="label">D 稳定生态内环</text>
      <text x="772" y="654" class="small">植被变疏，设施持续成为远景锚点</text>

      <text x="637" y="339" class="label">坡上水平台地</text>
      <text x="637" y="365" class="small">切填方承托，建筑保持水平</text>
      <path d="M628 359 L690 391" fill="none" stroke="#46574f" stroke-width="2"/>

      <text x="396" y="614" class="small" fill="#933f35">损坏且受阻正门</text>
      <text x="710" y="579" class="small" fill="#b54c31">检修入口／流送边界</text>
      <text x="453" y="427" class="label">中央植物玻璃房</text>
      <text x="453" y="451" class="tiny">穹顶／阳光房保持无遮挡天空</text>
    </g>

    <!-- Contours and height tags. -->
    <g fill="none" stroke="#f3eee2" stroke-width="3" opacity="0.75" stroke-dasharray="9 10">
      <path d="M82 564 C132 504 118 376 179 290"/>
      <path d="M273 695 C327 632 331 567 297 509"/>
      <path d="M839 673 C891 597 921 510 904 431"/>
    </g>
    <g class="tiny">
      <text x="72" y="588">约 +8 m 脊</text>
      <text x="280" y="715">约 +4 m 谷</text>
      <text x="860" y="699">约 +6 m 草坡</text>
      <text x="691" y="336">台地约 +7 m</text>
    </g>
  </g>

  <!-- Side legend. -->
  <g transform="translate(1255 155)">
    <rect width="290" height="535" rx="24" fill="#fffaf0" stroke="#c9bda8" stroke-width="2"/>
    <text x="28" y="48" class="label">读图说明</text>
    <g class="small">
      <rect x="28" y="76" width="34" height="22" rx="4" fill="#b9b49f"/><text x="78" y="94">死亡外环</text>
      <rect x="28" y="118" width="34" height="22" rx="4" fill="#87947b"/><text x="78" y="136">过渡环</text>
      <rect x="28" y="160" width="34" height="22" rx="4" fill="#9aa96e"/><text x="78" y="178">异色草带</text>
      <rect x="28" y="202" width="34" height="22" rx="4" fill="#6f8a62"/><text x="78" y="220">稳定内环</text>
      <rect x="28" y="244" width="34" height="22" rx="4" fill="#a89f89"/><text x="78" y="262">建筑台地</text>
      <path d="M28 300h42" stroke="#d7653f" stroke-width="7" stroke-linecap="round"/><text x="78" y="306">主体验路线</text>
    </g>
    <line x1="28" y1="338" x2="262" y2="338" stroke="#d8cdbb"/>
    <text x="28" y="376" class="small" font-weight="650">关键原则</text>
    <text x="28" y="410" class="tiny">• 路线穿越环带但不沿圆周整圈。</text>
    <text x="28" y="440" class="tiny">• 地形起伏制造分段揭示。</text>
    <text x="28" y="470" class="tiny">• 正门先失败，再绕至坡下入口。</text>
    <text x="28" y="500" class="tiny">• 穹顶和玻璃屋顶始终接受天光。</text>
  </g>

  <g transform="translate(1320 750)">
    <path d="M70 120V22 M70 22L56 47 M70 22L84 47" stroke="#26362f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="58" y="15" class="label">北</text>
    <text x="92" y="78" class="small">+Z</text>
  </g>
  <g transform="translate(1260 890)">
    <path d="M0 0h180" stroke="#24322c" stroke-width="5"/>
    <path d="M0-10v20M90-10v20M180-10v20" stroke="#24322c" stroke-width="4"/>
    <text x="-3" y="35" class="tiny">0</text><text x="78" y="35" class="tiny">25 m</text><text x="162" y="35" class="tiny">50 m</text>
  </g>
</svg>
